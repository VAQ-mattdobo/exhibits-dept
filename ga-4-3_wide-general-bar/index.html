<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=768, initial-scale=0.6667, minimum-scale=0.6667, maximum-scale=0.6667, user-scalable=no" />
  <title>VAQ Solid Panel - General Admissions (Green/Wide)</title>

<!-- Scale fix applied for Kuusoft environment rendering oversized. -->

  <style>
    html, body {
      width: 768px;
      height: 1080px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .panel {
      position: relative;
      width: 768px;
      height: 1080px;
      background-color: #7d9b2d;

      display: flex;
      align-items: center;
      justify-content: center;

      color: transparent; /* invisible but forces render */
      font-size: 1px;
    }

    .down-arrow {
      position: absolute;
      left: 50%;
      top: 53%;
      width: auto;
      height: calc(100% - 160px);
      max-width: calc(100% - 100px);
      opacity: 0.65;
      mix-blend-mode: screen;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div class="panel">
    <img class="down-arrow" src="../assets/down-arrow.svg" alt="" aria-hidden="true">
    &nbsp;
  </div>
</body>
</html>
