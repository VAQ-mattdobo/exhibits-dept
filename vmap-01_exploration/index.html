<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=1080, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>VAQ Visitor Map — Exploration</title>

  <!--
    VAQ VISITOR MAP — VMAP 01: EXPLORATION
    Target signage canvas: 1080 × 1440 px

    Folder assumptions:
      /assets/...
      /vmap-01_exploration/index.html
      /gs-1-2_daily-program-schedule/program-schedule-full/assets/icons/...

    Coordinate convention:
      - Percentages are measured from the top-left corner of the full 1080 × 1440 canvas.
      - Map-marker coordinates represent the centre of the SVG asset.
      - Large grouped layout blocks use top-left coordinates.

    Debug mode:
      Add ?debug=1 to the URL to reveal marker centres and bounding outlines.
  -->

  <style>
    @font-face {
      font-display: swap;
      font-family: "BlissPro";
      font-style: normal;
      font-weight: 400;
      src:
        url("../assets/BlissPro.woff2") format("woff2"),
        url("../assets/BlissPro.woff") format("woff");
    }

    @font-face {
      font-display: swap;
      font-family: "BlissPro";
      font-style: normal;
      font-weight: 700;
      src:
        url("../assets/BlissPro-Bold.woff2") format("woff2"),
        url("../assets/BlissPro-Bold.woff") format("woff");
    }

    :root {
      --page-width: 1080px;
      --page-height: 1440px;
      --stage-scale: 1;

      --text-dark: #202124;
      --text-mid: #5f6368;
      --orange: #f58220;
      --gallery-pill-radius: 13px;
      --amenity-marker-size: 26px;
      --guest-services-marker-size: 28px;
      --wayfinding-label-width: 72px;
      --wayfinding-arrow-width: 50px;
      --legend-pin-width: 62px;
      --active-pin-width: 72px;

      --debug-outline: rgba(214, 54, 54, 0.62);
      --debug-dot: #d63636;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171717;
    }

    body {
      font-family: "BlissPro", Arial, sans-serif;
      color: var(--text-dark);
    }

    .viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page {
      position: relative;
      flex: 0 0 auto;
      width: var(--page-width);
      height: var(--page-height);
      overflow: hidden;
      background: #ffffff;
      transform: scale(var(--stage-scale));
      transform-origin: center center;
    }

    .base-map,
    .base-map img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .positioned {
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
    }

    .anchor-centre {
      transform: translate(-50%, -50%);
    }

    .anchor-top-left {
      transform: none;
    }

    .page-title {
      margin: 0;
      font-size: 62px;
      font-weight: 700;
      letter-spacing: -1.2px;
      line-height: 0.96;
      white-space: nowrap;
    }

    .vaq-logo {
      display: block;
      width: 138px;
      height: auto;
    }

    .amenity-marker,
    .wayfinding-asset,
    .pin-asset {
      display: block;
      width: auto;
      height: auto;
      user-select: none;
    }

    .amenity-marker {
      width: var(--amenity-marker-size);
      height: var(--amenity-marker-size);
      object-fit: contain;
    }

    .guest-services-marker {
      width: var(--guest-services-marker-size);
      height: var(--guest-services-marker-size);
    }

    .direction-label {
      width: var(--wayfinding-label-width);
    }

    .direction-arrow {
      width: var(--wayfinding-arrow-width);
    }

    .legend-pin {
      width: var(--legend-pin-width);
    }

    .active-pin {
      width: var(--active-pin-width);
      filter: drop-shadow(0 6px 5px rgba(0, 0, 0, 0.28));
    }

    .you-are-here-key {
      display: flex;
      align-items: center;
      gap: 15px;
      white-space: nowrap;
    }

    .you-are-here-key .legend-pin {
      position: relative;
      left: 14px;
    }

    .you-are-here-key span {
      color: #65707a;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .qr-block {
      width: 170px;
      text-align: center;
      color: var(--orange);
    }

    .qr-frame {
      position: relative;
      display: flex;
      width: 156px;
      height: 156px;
      margin: 0 auto;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--orange);
      border-radius: 14px;
    }

    .qr-heading,
    .qr-url {
      position: absolute;
      left: 50%;
      margin: 0;
      padding: 0 6px;
      background: #ffffff;
      white-space: nowrap;
    }

    .qr-heading {
      top: 0;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      transform: translate(-50%, -50%);
    }

    .qr-code {
      display: block;
      width: 112px;
      height: 112px;
    }

    .qr-url {
      bottom: 0;
      font-size: 8px;
      line-height: 1;
      transform: translate(-50%, 50%);
    }

    .legend-heading {
      margin: 0;
      color: #202124;
      font-size: 39px;
      font-weight: 700;
      letter-spacing: 0.8px;
      line-height: 1;
      text-transform: uppercase;
    }

    .gallery-legend-column {
      display: grid;
      width: 360px;
      gap: 1px;
    }

    .gallery-legend-item {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      align-items: center;
      column-gap: 8px;
      min-height: 42px;
    }

    .gallery-legend-icon {
      position: relative;
      left: 11px;
      display: block;
      width: 64px;
      height: 42px;
      background-color: var(--gallery-icon-color);
      -webkit-mask-image: var(--gallery-icon-url);
      mask-image: var(--gallery-icon-url);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    .gallery-legend-pill {
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px 3px;
      border-radius: var(--gallery-pill-radius);
      color: rgba(255, 255, 255, 0.98);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09);
    }

    .amenity-legend {
      display: grid;
      width: 190px;
      gap: 5px;
      color: #444444;
      font-size: 13px;
      line-height: 1;
    }

    .amenity-legend-item {
      display: grid;
      grid-template-columns: 23px minmax(0, 1fr);
      align-items: center;
      column-gap: 7px;
      min-height: 23px;
    }

    .amenity-legend-item img {
      display: block;
      width: 23px;
      height: 23px;
      object-fit: contain;
    }

    .footer-cta {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #687078;
      font-size: 15px;
      line-height: 1;
      white-space: nowrap;
    }

    .footer-cta span {
      transform: translateY(7px);
    }

    .footer-cta strong {
      color: var(--orange);
      font-size: 24px;
      font-weight: 700;
      transform: translateY(3px);
    }

    .debug-panel {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 999;
      display: none;
      max-width: 520px;
      padding: 8px 10px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.76);
      color: #ffffff;
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 1.25;
      white-space: pre-wrap;
    }

    .debug-enabled .debug-panel {
      display: block;
    }

    .debug-enabled .positioned {
      outline: 1px dashed var(--debug-outline);
    }

    .debug-dot {
      position: absolute;
      display: none;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      margin-top: -3.5px;
      border-radius: 50%;
      background: var(--debug-dot);
      box-shadow: 0 0 0 1px #ffffff;
    }

    .debug-enabled .debug-dot {
      display: block;
    }
  </style>
</head>

    /* ======================================================================
       6. GENERIC HELPERS
       ====================================================================== */

    function getAnchorClass(anchor = "centre") {
      return anchor === "top-left" ? "anchor-top-left" : "anchor-centre";
    }

    function setPosition(element, { x, y, anchor = "centre" }) {
      element.classList.add("positioned", getAnchorClass(anchor));
      element.style.setProperty("--x", x);
      element.style.setProperty("--y", y);
      return element;
    }

    function makeImage(src, className = "", alt = "") {
      const image = document.createElement("img");
      image.src = src;
      image.alt = alt;
      image.className = className;
      return image;
    }

    function getGalleryIconUrl(iconPath) {
      const filename = String(iconPath || "").split("/").pop();
      return `${GALLERY_ICON_BASE_PATH}${filename}`;
    }

    function makeDebugDot(x, y) {
      if (!DEBUG_MODE) return;
      const dot = document.createElement("span");
      dot.className = "debug-dot";
      dot.style.left = `${x}%`;
      dot.style.top = `${y}%`;
      document.getElementById("debug-layer").appendChild(dot);
    }

    function updateDebugPanel(message) {
      if (!DEBUG_MODE) return;
      document.getElementById("debug-panel").textContent = [
        `Profile: ${MAP_PROFILE.key}`,
        "Canvas: 1080 × 1440",
        `Amenity overlays: ${AMENITY_MARKERS.length}`,
        `Active You Are Here pin: ${MAP_PROFILE.activeYouAreHere.visible ? "enabled" : "disabled"}`,
        message
      ].join("\n");
    }

    /* ======================================================================
       8. MAP OVERLAYS
       ====================================================================== */

    function getAmenityMarkerSizePx(marker) {
      return marker.className === "guest-services-marker"
        ? 28
        : 26;
    }

    /*
      Tight amenity groups are resolved dynamically at render time.

      The declared x/y values remain the geographic source anchors. Icons are
      shifted only when their visible rectangles would touch or overlap. Each
      collision is resolved along the smallest axis of movement, producing
      compact, pixel-aligned clusters while preserving as much illustrated-map
      artwork as possible beneath the overlays.
    */
    function resolveAmenityMarkerLayout(markers) {
      const canvasWidth = 1080;
      const canvasHeight = 1440;

      const layout = markers.map((marker) => ({
        ...marker,
        sourceX: marker.x,
        sourceY: marker.y,
        px: (marker.x / 100) * canvasWidth,
        py: (marker.y / 100) * canvasHeight,
        sizePx: getAmenityMarkerSizePx(marker)
      }));

      function separateTouchingPairs() {
        let moved = false;

        for (let i = 0; i < layout.length; i += 1) {
          for (let j = i + 1; j < layout.length; j += 1) {
            const a = layout[i];
            const b = layout[j];
            const requiredDistance =
              ((a.sizePx + b.sizePx) / 2) + AMENITY_CLUSTER_GAP_PX;

            const dx = b.px - a.px;
            const dy = b.py - a.py;
            const overlapX = requiredDistance - Math.abs(dx);
            const overlapY = requiredDistance - Math.abs(dy);

            if (overlapX <= 0 || overlapY <= 0) continue;

            moved = true;

            if (overlapX <= overlapY) {
              const direction = dx === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dx);
              const shift = (overlapX / 2) + 0.05;
              a.px -= direction * shift;
              b.px += direction * shift;
            } else {
              const direction = dy === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dy);
              const shift = (overlapY / 2) + 0.05;
              a.py -= direction * shift;
              b.py += direction * shift;
            }
          }
        }

        return moved;
      }

      for (let pass = 0; pass < AMENITY_LAYOUT_MAX_ITERATIONS; pass += 1) {
        if (!separateTouchingPairs()) break;
      }

      /*
        Snap resolved centres to whole pixels, then make a final integer-pixel
        pass so icons retain a true visible gap rather than merely a
        sub-pixel separation.
      */
      layout.forEach((marker) => {
        marker.px = Math.round(marker.px);
        marker.py = Math.round(marker.py);
      });

      for (let pass = 0; pass < AMENITY_LAYOUT_MAX_ITERATIONS; pass += 1) {
        let moved = false;

        for (let i = 0; i < layout.length; i += 1) {
          for (let j = i + 1; j < layout.length; j += 1) {
            const a = layout[i];
            const b = layout[j];
            const requiredDistance =
              ((a.sizePx + b.sizePx) / 2) + AMENITY_CLUSTER_GAP_PX;

            const dx = b.px - a.px;
            const dy = b.py - a.py;
            const overlapX = requiredDistance - Math.abs(dx);
            const overlapY = requiredDistance - Math.abs(dy);

            if (overlapX <= 0 || overlapY <= 0) continue;

            moved = true;

            if (overlapX <= overlapY) {
              const direction = dx === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dx);
              const shift = Math.ceil(overlapX / 2);
              a.px -= direction * shift;
              b.px += direction * shift;
            } else {
              const direction = dy === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dy);
              const shift = Math.ceil(overlapY / 2);
              a.py -= direction * shift;
              b.py += direction * shift;
            }
          }
        }

        if (!moved) break;
      }

      return layout.map((marker) => ({
        ...marker,
        x: (marker.px / canvasWidth) * 100,
        y: (marker.py / canvasHeight) * 100
      }));
    }

    function renderAmenityMarkers() {
      const layer = document.getElementById("amenity-marker-layer");
      const resolvedMarkers = resolveAmenityMarkerLayout(AMENITY_MARKERS);

      resolvedMarkers.forEach((marker) => {
        const type = AMENITY_TYPES[marker.type];
        if (!type) {
          console.warn(`Unknown amenity type: ${marker.type}`);
          return;
        }

        const extraClass = marker.className ? ` ${marker.className}` : "";
        const image = makeImage(type.icon, `amenity-marker${extraClass}`);
        image.dataset.markerId = marker.id;
        image.title = `${type.label}: ${marker.id}`;
        setPosition(image, marker);
        layer.appendChild(image);
        makeDebugDot(marker.x, marker.y);
      });
    }

    function renderActiveYouAreHerePin() {
      const pin = MAP_PROFILE.activeYouAreHere;
      if (!pin.visible || !Number.isFinite(pin.x) || !Number.isFinite(pin.y)) return;

      const layer = document.getElementById("dynamic-marker-layer");
      const image = makeImage("../assets/you-are-here.svg", "pin-asset active-pin");
      setPosition(image, pin);
      layer.appendChild(image);
      makeDebugDot(pin.x, pin.y);
    }

    /* ======================================================================
       9. LEGENDS
       ====================================================================== */

    function renderYouAreHereLegendKey() {
      const layer = document.getElementById("legend-layer");
      const key = document.createElement("div");
      key.className = "you-are-here-key";
      key.innerHTML = `
        <img class="pin-asset legend-pin" src="../assets/you-are-here.svg" alt="">
        <span>= You are here</span>
      `;
      setPosition(key, MAP_PROFILE.chrome.youAreHereLegend);
      layer.appendChild(key);
    }

    function renderAmenityLegend() {
      const layer = document.getElementById("legend-layer");
      const legend = document.createElement("section");
      legend.className = "amenity-legend";

      AMENITY_LEGEND_ORDER.forEach((typeKey) => {
        const type = AMENITY_TYPES[typeKey];
        const item = document.createElement("div");
        item.className = "amenity-legend-item";
        item.innerHTML = `
          <img src="${type.icon}" alt="">
          <span>${type.label}</span>
        `;
        legend.appendChild(item);
      });

      setPosition(legend, MAP_PROFILE.chrome.amenityLegend);
      layer.appendChild(legend);
    }

    function renderGalleryLegendColumn(items, position, styleMap) {
      const layer = document.getElementById("legend-layer");
      const column = document.createElement("section");
      column.className = "gallery-legend-column";

      items.forEach((legendItem) => {
        const style = styleMap.get(legendItem.key);
        if (!style) {
          console.warn(`Missing location style for gallery legend item: ${legendItem.key}`);
          return;
        }

        const item = document.createElement("div");
        item.className = "gallery-legend-item";

        const icon = document.createElement("span");
        icon.className = "gallery-legend-icon";
        icon.style.setProperty("--gallery-icon-color", style.hex_color);
        icon.style.setProperty(
          "--gallery-icon-url",
          `url("${getGalleryIconUrl(style.icon_path)}")`
        );

        const pill = document.createElement("div");
        pill.className = "gallery-legend-pill";
        pill.style.backgroundColor = style.hex_color;
        pill.textContent = legendItem.label;

        item.append(icon, pill);
        column.appendChild(item);
      });

      setPosition(column, position);
      layer.appendChild(column);
    }

    function renderGalleryLegend(locationStyles) {
      const styleMap = new Map(locationStyles.map((style) => [style.location_key, style]));
      const layer = document.getElementById("legend-layer");

      const heading = document.createElement("h2");
      heading.className = "legend-heading";
      heading.textContent = "Legend";
      setPosition(heading, MAP_PROFILE.chrome.legendHeading);
      layer.appendChild(heading);

      renderGalleryLegendColumn(
        GALLERY_LEGEND_LAYOUT.leftColumn,
        MAP_PROFILE.chrome.galleryLegendLeft,
        styleMap
      );

      renderGalleryLegendColumn(
        GALLERY_LEGEND_LAYOUT.rightColumn,
        MAP_PROFILE.chrome.galleryLegendRight,
        styleMap
      );
    }

    /* ======================================================================
       10. SUPABASE LOCATION-STYLE LOADING

       Gallery colours and icon filenames are loaded from the same
       program_location_styles table used by the Daily Program Schedule.
       If the network or database is unavailable, the page falls back to the
       supplied export so the visitor map still renders.
       ====================================================================== */

    async function fetchActiveLocationStyles() {
      const { data, error } = await supabaseClient
        .from("program_location_styles")
        .select("location_key, display_name, hex_color, icon_path, sort_order")
        .eq("is_active", true);

      if (error) throw error;
      return Array.isArray(data) && data.length ? data : FALLBACK_LOCATION_STYLES;
    }

    async function loadLocationStyles() {
      try {
        const locationStyles = await fetchActiveLocationStyles();
        updateDebugPanel(`Supabase styles loaded: ${locationStyles.length}`);
        return locationStyles;
      } catch (error) {
        console.error("Could not load program_location_styles. Using fallback export.", error);
        updateDebugPanel(`Supabase style query failed. Using fallback export.\n${error.message}`);
        return FALLBACK_LOCATION_STYLES;
      }
    }

    /* ======================================================================
       11. FUTURE NEXT-PROGRAM PIN HOOK

       This function is intentionally unused until gallery-specific pin
       coordinates are supplied. It is ready for the later integration pass.
       ====================================================================== */

    function setNextProgramPin(locationKey) {
      const layer = document.getElementById("dynamic-marker-layer");
      const existing = document.getElementById("next-program-pin");
      if (existing) existing.remove();
      if (!locationKey) return;

      const position = MAP_PROFILE.nextProgramAnchors[locationKey];
      if (!position) {
        console.info(`No next-program map anchor configured for: ${locationKey}`);
        return;
      }

      const pin = makeImage("../assets/next-program-here.svg", "pin-asset active-pin");
      pin.id = "next-program-pin";
      setPosition(pin, position);
      layer.appendChild(pin);
    }

    /* ======================================================================
       12. VIEWPORT SCALING AND INITIALIZATION
       ====================================================================== */

    function fitCanvasToViewport() {
      const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1440);
      document.documentElement.style.setProperty("--stage-scale", scale);
    }

    async function initialize() {
      document.getElementById("page").classList.toggle("debug-enabled", DEBUG_MODE);
      fitCanvasToViewport();

      renderChrome();
      renderAmenityMarkers();
      renderActiveYouAreHerePin();
      renderYouAreHereLegendKey();
      renderAmenityLegend();

      const locationStyles = await loadLocationStyles();
      renderGalleryLegend(locationStyles);
    }

    window.addEventListener("resize", fitCanvasToViewport);
    window.addEventListener("DOMContentLoaded", initialize);
  </script>
