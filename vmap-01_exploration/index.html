       6. GENERIC HELPERS
       ====================================================================== */

    function getAnchorClass(anchor = "centre") {
      return anchor === "top-left" ? "anchor-top-left" : "anchor-centre";
    }

    function setPosition(element, { x, y, anchor = "centre" }, debugLabel = "") {
      element.classList.add("positioned", getAnchorClass(anchor));
      element.style.setProperty("--x", x);
      element.style.setProperty("--y", y);

      const resolvedDebugLabel =
        debugLabel
        || element.dataset.debugLabel
        || element.dataset.markerId
        || element.dataset.nextProgramLocationKey
        || element.id
        || [...element.classList].filter((className) => className !== "positioned").join(".")
        || element.tagName.toLowerCase();

      makeDebugCoordinateLabel(x, y, resolvedDebugLabel);
      return element;
    }

    function makeImage(src, className = "", alt = "") {
      const image = document.createElement("img");
      image.src = src;
      image.alt = alt;
      image.className = className;
      return image;
    }

    function getGalleryIconUrl(iconPath) {
      const filename = String(iconPath || "").split("/").pop();
      if (!filename) return "";
      return `${GALLERY_ICON_BASE_PATH}${filename}`;
    }

    function formatDebugCoordinate(value) {
      return Number.isInteger(value)
        ? value.toFixed(1)
        : String(value);
    }

    function makeDebugCoordinateLabel(x, y, label = "") {
      if (!DEBUG_MODE) return;

      const coordinateLabel = document.createElement("span");
      coordinateLabel.className = "debug-coordinate-label";
      coordinateLabel.style.left = `${x}%`;
      coordinateLabel.style.top = `${y}%`;
      coordinateLabel.textContent =
        `${label ? `${label} · ` : ""}x:${formatDebugCoordinate(x)}% y:${formatDebugCoordinate(y)}%`;

      document.getElementById("debug-layer").appendChild(coordinateLabel);
    }

    function makeDebugDot(x, y) {
      if (!DEBUG_MODE) return;
      const dot = document.createElement("span");
      dot.className = "debug-dot";
      dot.style.left = `${x}%`;
      dot.style.top = `${y}%`;
      document.getElementById("debug-layer").appendChild(dot);
    }

    function updateDebugPanel(message) {
      if (!DEBUG_MODE) return;
      document.getElementById("debug-panel").textContent = [
        `Profile: ${MAP_PROFILE.key}`,
        "Canvas: 1080 × 1440",
        `Amenity overlays: ${AMENITY_MARKERS.length}`,
        `Active You Are Here pin: ${MAP_PROFILE.activeYouAreHere.visible ? "enabled" : "disabled"}`,
        message
      ].join("\n");
    }

      setPosition(logo, p.logo);
      layer.appendChild(logo);

      const exitArrow = makeImage("../assets/icons/exit-arrow.svg", "wayfinding-asset direction-arrow");
      setPosition(exitArrow, p.exitArrow);
      layer.appendChild(exitArrow);

      const exitLabel = makeImage("../assets/icons/exit-label.svg", "wayfinding-asset direction-label");
      setPosition(exitLabel, p.exitLabel);
      layer.appendChild(exitLabel);

      const enterArrow = makeImage("../assets/icons/enter-arrow.svg", "wayfinding-asset direction-arrow");
      setPosition(enterArrow, p.enterArrow);
      layer.appendChild(enterArrow);

      const enterLabel = makeImage("../assets/icons/enter-label.svg", "wayfinding-asset direction-label");
      setPosition(enterLabel, p.enterLabel);
      layer.appendChild(enterLabel);

      const qrBlock = document.createElement("section");
      qrBlock.className = "qr-block";
      qrBlock.innerHTML = `
        <div class="qr-frame">
          <p class="qr-heading">Scan for PDF</p>
          <img class="qr-code" src="../assets/qr-code.svg" alt="">
          <p class="qr-url">vanaqua.org/visit/map/</p>
        </div>
      `;
      setPosition(qrBlock, p.qrBlock);
      layer.appendChild(qrBlock);

      const footer = document.createElement("div");
      footer.className = "footer-cta";
      footer.innerHTML = `
        <span>Share what you loved about your visit:</span>
        <strong>@VanAqua&nbsp;&nbsp;#VanAqua</strong>
      `;
      setPosition(footer, p.footer);
      layer.appendChild(footer);

      Object.values(p).forEach(({ x, y }) => makeDebugDot(x, y));
    }

    /* ======================================================================
       8. MAP OVERLAYS
       ====================================================================== */

    function getAmenityMarkerSizePx(marker) {
      return marker.className === "guest-services-marker"
        ? 28
        : 26;
    }

    /*
      Tight amenity groups are resolved dynamically at render time.

      The declared x/y values remain the geographic source anchors. Icons are
      shifted only when their visible rectangles would touch or overlap. Each
      collision is resolved along the smallest axis of movement, producing
      compact, pixel-aligned clusters while preserving as much illustrated-map
      artwork as possible beneath the overlays.
    */
    function resolveAmenityMarkerLayout(markers) {
      const canvasWidth = 1080;
      const canvasHeight = 1440;

      const layout = markers.map((marker) => ({
        ...marker,
        sourceX: marker.x,
        sourceY: marker.y,
        px: (marker.x / 100) * canvasWidth,
        py: (marker.y / 100) * canvasHeight,
        sizePx: getAmenityMarkerSizePx(marker)
      }));

      function separateTouchingPairs() {
        let moved = false;

        for (let i = 0; i < layout.length; i += 1) {
          for (let j = i + 1; j < layout.length; j += 1) {
            const a = layout[i];
            const b = layout[j];
            const requiredDistance =
              ((a.sizePx + b.sizePx) / 2) + AMENITY_CLUSTER_GAP_PX;

            const dx = b.px - a.px;
            const dy = b.py - a.py;
            const overlapX = requiredDistance - Math.abs(dx);
            const overlapY = requiredDistance - Math.abs(dy);

            if (overlapX <= 0 || overlapY <= 0) continue;

            moved = true;

            if (overlapX <= overlapY) {
              const direction = dx === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dx);
              const shift = (overlapX / 2) + 0.05;
              a.px -= direction * shift;
              b.px += direction * shift;
            } else {
              const direction = dy === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dy);
              const shift = (overlapY / 2) + 0.05;
              a.py -= direction * shift;
              b.py += direction * shift;
            }
          }
        }

        return moved;
      }

      for (let pass = 0; pass < AMENITY_LAYOUT_MAX_ITERATIONS; pass += 1) {
        if (!separateTouchingPairs()) break;
      }

      /*
        Snap resolved centres to whole pixels, then make a final integer-pixel
        pass so icons retain a true visible gap rather than merely a
        sub-pixel separation.
      */
      layout.forEach((marker) => {
        marker.px = Math.round(marker.px);
        marker.py = Math.round(marker.py);
      });

      for (let pass = 0; pass < AMENITY_LAYOUT_MAX_ITERATIONS; pass += 1) {
        let moved = false;

        for (let i = 0; i < layout.length; i += 1) {
          for (let j = i + 1; j < layout.length; j += 1) {
            const a = layout[i];
            const b = layout[j];
            const requiredDistance =
              ((a.sizePx + b.sizePx) / 2) + AMENITY_CLUSTER_GAP_PX;

            const dx = b.px - a.px;
            const dy = b.py - a.py;
            const overlapX = requiredDistance - Math.abs(dx);
            const overlapY = requiredDistance - Math.abs(dy);

            if (overlapX <= 0 || overlapY <= 0) continue;

            moved = true;

            if (overlapX <= overlapY) {
              const direction = dx === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dx);
              const shift = Math.ceil(overlapX / 2);
              a.px -= direction * shift;
              b.px += direction * shift;
            } else {
              const direction = dy === 0
                ? (a.id.localeCompare(b.id) < 0 ? 1 : -1)
                : Math.sign(dy);
              const shift = Math.ceil(overlapY / 2);
              a.py -= direction * shift;
              b.py += direction * shift;
            }
          }
        }

        if (!moved) break;
      }

      return layout.map((marker) => ({
        ...marker,
        x: (marker.px / canvasWidth) * 100,
        y: (marker.py / canvasHeight) * 100
      }));
    }

    function renderAmenityMarkers() {
      const layer = document.getElementById("amenity-marker-layer");
      const resolvedMarkers = resolveAmenityMarkerLayout(AMENITY_MARKERS);

      resolvedMarkers.forEach((marker) => {
        const type = AMENITY_TYPES[marker.type];
        if (!type) {
          console.warn(`Unknown amenity type: ${marker.type}`);
          return;
        }

        const extraClass = marker.className ? ` ${marker.className}` : "";
        const image = makeImage(type.icon, `amenity-marker${extraClass}`);
        image.dataset.markerId = marker.id;
        image.title = `${type.label}: ${marker.id}`;
        setPosition(image, marker);
        layer.appendChild(image);
        makeDebugDot(marker.x, marker.y);
      });
    }

    function renderActiveYouAreHerePin() {
      const pin = MAP_PROFILE.activeYouAreHere;
      if (!pin.visible || !Number.isFinite(pin.x) || !Number.isFinite(pin.y)) return;

      const layer = document.getElementById("dynamic-marker-layer");
      const marker = document.createElement("div");
      marker.className = "active-pin-marker";

      const shadow = document.createElement("span");
      shadow.className = "active-pin-shadow";

      const image = makeImage(
        "../assets/you-are-here.svg",
        "pin-asset animated-map-pin-image"
      );

      marker.append(shadow, image);
      setPosition(marker, pin);
      layer.appendChild(marker);
      makeDebugDot(pin.x, pin.y);
    }

    /* ======================================================================
       9. LEGENDS
       ====================================================================== */

    function renderYouAreHereLegendKey() {
      const layer = document.getElementById("legend-layer");
      const key = document.createElement("div");
      key.className = "you-are-here-key";
      key.innerHTML = `
        <img class="pin-asset legend-pin" src="../assets/you-are-here.svg" alt="">
        <span>= You are here</span>
      `;
      setPosition(key, MAP_PROFILE.chrome.youAreHereLegend);
      layer.appendChild(key);
    }

    function renderNextProgramLegendKey() {
      const layer = document.getElementById("legend-layer");
      const key = document.createElement("div");
      key.id = "next-program-legend-key";
      key.className = "you-are-here-key";
      key.hidden = true;
      key.innerHTML = `
        <img class="pin-asset legend-pin" src="../assets/next-program-here.svg" alt="">
        <span>= Next program here</span>
      `;
      setPosition(key, MAP_PROFILE.chrome.nextProgramLegend);
      layer.appendChild(key);
    }

    function setNextProgramLegendVisibility(isVisible) {
      const key = document.getElementById("next-program-legend-key");
      if (key) key.hidden = !isVisible;
    }

    function renderAmenityLegend() {
      const layer = document.getElementById("legend-layer");
      const legend = document.createElement("section");
      legend.className = "amenity-legend";

      AMENITY_LEGEND_ORDER.forEach((typeKey) => {
        const type = AMENITY_TYPES[typeKey];
        const item = document.createElement("div");
        item.className = "amenity-legend-item";
        item.innerHTML = `
          <img src="${type.icon}" alt="">
          <span>${type.label}</span>
        `;
        legend.appendChild(item);
      });

      setPosition(legend, MAP_PROFILE.chrome.amenityLegend);
      layer.appendChild(legend);
    }

    function renderGalleryLegendColumn(items, position, styleMap) {
      const layer = document.getElementById("legend-layer");
      const column = document.createElement("section");
      column.className = "gallery-legend-column";
      column.style.width = `${GALLERY_LEGEND_COLUMN_WIDTH_PX}px`;

      items.forEach((legendItem) => {
        const style = styleMap.get(legendItem.key);
        if (!style) {
          console.warn(`Missing location style for gallery legend item: ${legendItem.key}`, legendItem);
          return;
        }

        const item = document.createElement("div");
        item.className = "gallery-legend-item";

        const icon = document.createElement("span");
        icon.className = "gallery-legend-icon";
        icon.style.setProperty("--gallery-icon-color", style.hex_color);
        icon.style.setProperty(
          "--gallery-icon-url",
          `url("${getGalleryIconUrl(style.icon_path)}")`
        );

        const pill = document.createElement("div");
        pill.className = "gallery-legend-pill";
        pill.style.width = `${GALLERY_LEGEND_PILL_WIDTH_PX}px`;
        pill.style.maxWidth = `${GALLERY_LEGEND_PILL_WIDTH_PX}px`;
        pill.style.backgroundColor = style.hex_color;
        pill.textContent = legendItem.label;

        item.append(icon, pill);
        column.appendChild(item);
      });

      setPosition(column, position);
      layer.appendChild(column);
    }

    function renderGalleryLegend(locationStyles) {
      const styleMap = new Map(locationStyles.map((style) => [style.location_key, style]));
      const layer = document.getElementById("legend-layer");

      const heading = document.createElement("h2");
      heading.className = "legend-heading";
      heading.textContent = "Legend";
      setPosition(heading, MAP_PROFILE.chrome.legendHeading);
      layer.appendChild(heading);

      renderGalleryLegendColumn(
        GALLERY_LEGEND_LAYOUT.leftColumn,
        MAP_PROFILE.chrome.galleryLegendLeft,
        styleMap
      );

      renderGalleryLegendColumn(
        GALLERY_LEGEND_LAYOUT.rightColumn,
        MAP_PROFILE.chrome.galleryLegendRight,
        styleMap
      );
    }

    /* ======================================================================
       10. SUPABASE LOCATION-STYLE LOADING

       Gallery colours and icon filenames are loaded from the same
       program_location_styles table used by the Daily Program Schedule.
       If the network or database is unavailable, the page falls back to the
       supplied export so the visitor map still renders.
       ====================================================================== */

    async function fetchActiveLocationStyles() {
      const { data, error } = await supabaseClient
        .from("program_location_styles")
        .select("location_key, display_name, hex_color, icon_path, sort_order")
        .eq("is_active", true);

      if (error) throw error;
      return Array.isArray(data) && data.length ? data : FALLBACK_LOCATION_STYLES;
    }

    async function loadLocationStyles() {
      try {
        const locationStyles = await fetchActiveLocationStyles();
        updateDebugPanel(`Supabase styles loaded: ${locationStyles.length}`);
        return locationStyles;
      } catch (error) {
        console.error("Could not load program_location_styles. Using fallback export.", error);
        updateDebugPanel(`Supabase style query failed. Using fallback export.\n${error.message}`);
        return FALLBACK_LOCATION_STYLES;
      }
    }

    /* ======================================================================
       11. DATABASE-DRIVEN NEXT-PROGRAM MAP PINS

       This mirrors the guest-facing Daily Program Schedule definition of
       "next": the earliest eligible start time remains highlighted until
       five minutes after that start time. Tied programs are intentionally
       retained, so several gallery pins may bounce at once.
       ====================================================================== */

    function getTodayInVancouver() {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE_NAME
      }).format(new Date());
    }

    function getCurrentVancouverParts() {
      const formatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE_NAME,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      const parts = formatter.formatToParts(new Date());
      const get = (type) => parts.find((part) => part.type === type)?.value ?? "00";

      return {
        hour: Number(get("hour")),
        minute: Number(get("minute")),
        second: Number(get("second"))
      };
    }

    function getCurrentMinutesInVancouver() {
      const now = getCurrentVancouverParts();
      return (now.hour * 60) + now.minute;
    }

    function parseTimeToMinutes(time) {
      if (!/^\d{2}:\d{2}$/.test(time || "")) return null;
      const [hours, minutes] = time.split(":").map(Number);
      return (hours * 60) + minutes;
    }

    /*
      Map-specific Next Program Here rule:
      - Consider only non-cancelled schedule entries with valid start times.
      - Keep future entries eligible no matter how far in advance they occur.
      - Keep a started entry eligible until five minutes after its start time.
      - Select the earliest eligible start time only.
      - Render every distinct gallery sharing that qualifying start time.
    */
    function resolveNextProgramLocationKeys(entries, nowMinutes) {
      const eligibleEntries = (Array.isArray(entries) ? entries : [])
        .filter((entry) => !entry.is_cancelled)
        .map((entry) => ({
          ...entry,
          start_minutes: parseTimeToMinutes(entry.start_time)
        }))
        .filter((entry) => (
          Number.isInteger(entry.start_minutes)
          && nowMinutes < (
            entry.start_minutes + NEXT_PROGRAM_POST_START_GRACE_MINUTES
          )
        ))
        .sort((a, b) => a.start_minutes - b.start_minutes);

      if (!eligibleEntries.length) return [];

      const nextStartMinutes = eligibleEntries[0].start_minutes;
      return [...new Set(
        eligibleEntries
          .filter((entry) => entry.start_minutes === nextStartMinutes)
          .map((entry) => entry.location_key)
          .filter(Boolean)
      )];
    }

    function createAnimatedNextProgramPin(locationKey, position) {
      const marker = document.createElement("div");
      marker.className = "active-pin-marker next-program-pin-marker";
      marker.dataset.nextProgramLocationKey = locationKey;

      const shadow = document.createElement("span");
      shadow.className = "active-pin-shadow";

      const image = makeImage(
        "../assets/next-program-here.svg",
        "pin-asset animated-map-pin-image"
      );

      marker.append(shadow, image);
      setPosition(marker, position);
      return marker;
    }

    function renderNextProgramPins(locationKeys) {
      const layer = document.getElementById("dynamic-marker-layer");
      layer.querySelectorAll(".next-program-pin-marker").forEach((marker) => marker.remove());

      const uniqueKeys = [...new Set(locationKeys || [])];
      const renderedKeys = [];

      uniqueKeys.forEach((locationKey) => {
        const position = MAP_PROFILE.nextProgramAnchors[locationKey];
        if (!position) {
          console.info(`No next-program map anchor configured for: ${locationKey}`);
          return;
        }

        layer.appendChild(createAnimatedNextProgramPin(locationKey, position));
        makeDebugDot(position.x, position.y);
        renderedKeys.push(locationKey);
      });

      nextProgramState.lastRenderedLocationKeys = renderedKeys;
      setNextProgramLegendVisibility(renderedKeys.length > 0);
      updateDebugPanel(`Next Program Here pins: ${renderedKeys.length}${renderedKeys.length ? `\n${renderedKeys.join(", ")}` : ""}`);
    }

    function getNextProgramBoundaryMinutes(entries, nowMinutes) {
      return (Array.isArray(entries) ? entries : [])
        .filter((entry) => !entry.is_cancelled)
        .flatMap((entry) => {
          const startMinutes = parseTimeToMinutes(entry.start_time);
          if (!Number.isInteger(startMinutes)) return [];
          return [
            startMinutes,
            startMinutes + NEXT_PROGRAM_POST_START_GRACE_MINUTES
          ];
        })
        .filter((minutes) => minutes > nowMinutes)
        .sort((a, b) => a - b)[0] ?? null;
    }

    function getMillisecondsUntilVancouverMinute(targetMinutes) {
      const now = getCurrentVancouverParts();
      const currentMinutes = (now.hour * 60) + now.minute;
      let delta = targetMinutes - currentMinutes;
      if (delta < 0) delta += 1440;

      const msRemaining = (60 - now.second) * 1000;
      return delta === 0
        ? msRemaining
        : msRemaining + ((delta - 1) * 60000);
    }

    function clearNextProgramBoundaryTimer() {
      if (nextProgramState.boundaryTimerId) {
        clearTimeout(nextProgramState.boundaryTimerId);
        nextProgramState.boundaryTimerId = null;
      }
    }

    function refreshNextProgramPinsFromEntries(entries) {
      clearNextProgramBoundaryTimer();

      const nowMinutes = getCurrentMinutesInVancouver();
      const locationKeys = resolveNextProgramLocationKeys(entries, nowMinutes);
      renderNextProgramPins(locationKeys);

      const nextBoundaryMinutes = getNextProgramBoundaryMinutes(entries, nowMinutes);
      if (!Number.isInteger(nextBoundaryMinutes)) return;

      nextProgramState.boundaryTimerId = setTimeout(
        () => refreshNextProgramPinsFromEntries(entries),
        getMillisecondsUntilVancouverMinute(nextBoundaryMinutes) + NEXT_PROGRAM_BOUNDARY_FUDGE_MS
      );
    }

    async function fetchLiveProgramSchedule() {
      const { data, error } = await supabaseClient
        .from("program_schedule_sets")
        .select("id, updated_at, entries_json")
        .eq("schedule_date", getTodayInVancouver())
        .eq("mode", "live")
        .maybeSingle();

      if (error) throw error;
      return data || null;
    }

    function getScheduleSignature(schedule) {
      return schedule
        ? JSON.stringify({
            id: schedule.id,
            updated_at: schedule.updated_at,
            entries_json: schedule.entries_json
          })
        : "";
    }

    async function refreshLiveNextProgramSchedule() {
      try {
        const schedule = await fetchLiveProgramSchedule();
        const signature = getScheduleSignature(schedule);

        if (signature !== nextProgramState.lastScheduleSignature) {
          nextProgramState.lastScheduleSignature = signature;
          refreshNextProgramPinsFromEntries(schedule?.entries_json || []);
        }
      } catch (error) {
        console.error("Could not refresh live next-program map pins.", error);
      }

      nextProgramState.refreshTimerId = setTimeout(
        refreshLiveNextProgramSchedule,
        NEXT_PROGRAM_DATA_REFRESH_MS
      );
    }

    async function initializeNextProgramPins() {
      renderNextProgramPins([]);
      await refreshLiveNextProgramSchedule();
    }

    /* ======================================================================
       12. VIEWPORT SCALING AND INITIALIZATION
       ====================================================================== */

    function fitCanvasToViewport() {
      const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1440);
      document.documentElement.style.setProperty("--stage-scale", scale);
    }

    async function initialize() {
      document.getElementById("page").classList.toggle("debug-enabled", DEBUG_MODE);
      fitCanvasToViewport();

      renderChrome();
      renderAmenityMarkers();
      renderActiveYouAreHerePin();
      renderYouAreHereLegendKey();
      renderNextProgramLegendKey();
      renderAmenityLegend();
      initializeNextProgramPins();

      const locationStyles = await loadLocationStyles();
      renderGalleryLegend(locationStyles);
    }

    window.addEventListener("resize", fitCanvasToViewport);
    window.addEventListener("DOMContentLoaded", initialize);
  </script>
