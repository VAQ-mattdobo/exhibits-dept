<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAQ Visitor Map — Exploration Gallery</title>

  <!--
    VAQ VISITOR MAP — INITIAL FRONT-END SCAFFOLD
    Target signage canvas: 1080 × 1440 px

    Coordinate convention:
      - Map-marker x/y values are percentages measured from the TOP-LEFT corner.
      - Marker coordinates represent the CENTER of the asset.
      - Larger blocks may use anchor: "top-left" when that is easier to position.

    Asset paths assume this structure:
      /assets/...
      /vmap-01_exploration/index.html
  -->

  <style>
    @font-face {
      font-family: "BlissPro";
      src: url("../assets/BlissPro.woff2") format("woff2"),
           url("../assets/BlissPro.woff") format("woff");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "BlissPro";
      src: url("../assets/BlissPro-Bold.woff2") format("woff2"),
           url("../assets/BlissPro-Bold.woff") format("woff");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --canvas-width: 1080;
      --canvas-height: 1440;
      --stage-scale: 1;
      --text-dark: #222222;
      --text-mid: #60656c;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --debug-outline: rgba(227, 80, 80, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111111;
      font-family: "BlissPro", Arial, sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .map-page {
      position: relative;
      flex: 0 0 auto;
      width: calc(var(--canvas-width) * 1px);
      height: calc(var(--canvas-height) * 1px);
      overflow: hidden;
      background: #ffffff;
      color: var(--text-dark);
      transform: scale(var(--stage-scale));
      transform-origin: center center;
    }

    .base-map,
    .base-map img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .overlay-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .positioned {
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
    }

    .anchor-center {
      transform: translate(-50%, -50%);
    }

    .anchor-top-left {
      transform: none;
    }

    .page-title {
      margin: 0;
      font-size: 66px;
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .vaq-logo {
      display: block;
      width: 150px;
      height: auto;
    }

    .amenity-marker,
    .wayfinding-asset,
    .program-marker {
      display: block;
      height: auto;
      user-select: none;
    }

    .amenity-marker {
      width: 29px;
    }

    .you-are-here-marker {
      width: 76px;
      filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.28));
    }

    .next-program-marker {
      width: 76px;
      filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.28));
      animation: soft-pulse 2.4s ease-in-out infinite;
    }

    @keyframes soft-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.08); }
    }

    .direction-label {
      width: 76px;
    }

    .direction-arrow {
      width: 58px;
    }

    .qr-block {
      width: 132px;
      text-align: center;
      color: #e87722;
      font-weight: 700;
    }

    .qr-heading {
      margin: 0 0 7px;
      font-size: 17px;
      line-height: 1;
    }

    .qr-code {
      display: block;
      width: 114px;
      height: 114px;
      margin: 0 auto;
    }

    .qr-url {
      margin: 7px 0 0;
      font-size: 9px;
      line-height: 1;
    }

    .legend-heading {
      margin: 0;
      color: #444444;
      font-size: 39px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
      text-transform: uppercase;
    }

    .amenity-legend {
      display: grid;
      gap: 7px;
      width: 190px;
      color: #444444;
      font-size: 14px;
      line-height: 1;
    }

    .amenity-legend-item {
      display: grid;
      grid-template-columns: 24px 1fr;
      align-items: center;
      gap: 7px;
    }

    .amenity-legend-item img {
      display: block;
      width: 24px;
      height: 24px;
    }

    .gallery-legend-placeholder {
      width: 635px;
      min-height: 290px;
      padding: 12px;
      border: 1px dashed rgba(0, 0, 0, 0.2);
      color: rgba(0, 0, 0, 0.5);
      font-size: 16px;
      line-height: 1.25;
    }

    .footer-cta {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-mid);
      font-size: 16px;
      white-space: nowrap;
    }

    .footer-cta strong {
      color: #e87722;
      font-size: 24px;
    }

    .debug-status {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 999;
      display: none;
      max-width: 510px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.74);
      color: #ffffff;
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 1.25;
    }

    .debug-enabled .debug-status {
      display: block;
    }

    .debug-enabled .positioned {
      outline: 1px dashed var(--debug-outline);
    }

    .debug-dot {
      position: absolute;
      display: none;
      width: 7px;
      height: 7px;
      margin-left: -3.5px;
      margin-top: -3.5px;
      border-radius: 50%;
      background: #e35050;
      box-shadow: 0 0 0 1px #ffffff;
      pointer-events: none;
    }

    .debug-enabled .debug-dot {
      display: block;
    }
  </style>
</head>

<body>
  <main class="viewport">
    <section id="mapPage" class="map-page" aria-label="Vancouver Aquarium Visitor Map">
      <picture class="base-map" aria-hidden="true">
        <source
          type="image/webp"
          srcset="../assets/visitor-map-base@1x.webp 1x, ../assets/visitor-map-base@2x.webp 2x">
        <img
          src="../assets/visitor-map-base@1x.png"
          srcset="../assets/visitor-map-base@1x.png 1x, ../assets/visitor-map-base@2x.png 2x"
          alt="">
      </picture>

      <div id="chromeLayer" class="overlay-layer" aria-hidden="true"></div>
      <div id="amenityMarkerLayer" class="overlay-layer" aria-hidden="true"></div>
      <div id="dynamicMarkerLayer" class="overlay-layer" aria-hidden="true"></div>
      <div id="legendLayer" class="overlay-layer" aria-hidden="true"></div>
      <div id="debugLayer" class="overlay-layer" aria-hidden="true"></div>

      <div id="debugStatus" class="debug-status"></div>
    </section>
  </main>

  <!-- Browser-safe Supabase client for this static GitHub Pages module. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    /* ================================================================
       1. PAGE SETTINGS
       ================================================================ */

    const DEBUG_MODE = true;
    const TITLE_ROTATION_MS = 8000;
    const PROGRAM_POLL_INTERVAL_MS = 60000;

    const SUPABASE_URL = "https://csxuuwbtxgdpvskggcux.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jPeweysUr7DZvFxG7F1-LQ_UR8MT1F9";

    /*
      TODO — Confirm the Daily Program Schedule table or view name.
      Leave this blank until the existing schema is confirmed. When a
      valid table or view is supplied, schedule polling begins automatically.
    */
    const PROGRAM_SCHEDULE_SOURCE = "";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    /* ================================================================
       2. MAP PROFILE — VMAP 01: EXPLORATION

       Coordinates are placeholder values for scaffold testing only.
       Replace them with measured percentage coordinates.
       ================================================================ */

    const MAP_PROFILE = {
      key: "vmap-01_exploration",
      titles: ["Visitor Map"],

      chrome: {
        title:            { x: 5.0,  y: 4.2,  anchor: "top-left" },
        logo:             { x: 82.0, y: 4.0,  anchor: "top-left" },
        qrBlock:          { x: 79.3, y: 56.0, anchor: "top-left" },
        legendHeading:    { x: 5.0,  y: 67.0, anchor: "top-left" },
        galleryLegend:    { x: 10.0, y: 72.4, anchor: "top-left" },
        amenityLegend:    { x: 78.0, y: 71.7, anchor: "top-left" },
        footer:           { x: 17.0, y: 95.2, anchor: "top-left" },
        exitLabel:        { x: 88.0, y: 34.7, anchor: "center" },
        exitArrow:        { x: 83.3, y: 34.7, anchor: "center" },
        enterLabel:       { x: 88.0, y: 38.2, anchor: "center" },
        enterArrow:       { x: 83.3, y: 38.2, anchor: "center" }
      },

      youAreHere: {
        x: 78.5,
        y: 27.0,
        visible: true
      },

      /*
        Future dynamic marker anchors. Add one coordinate per gallery or
        scheduled-program location key once the list is confirmed.
      */
      programLocationAnchors: {
        // "exploration-gallery": { x: 00.0, y: 00.0 },
        // "tropics":             { x: 00.0, y: 00.0 },
      }
    };

    /* ================================================================
       3. AMENITY TYPES AND MAP INSTANCES

       Add each map icon occurrence to AMENITY_MARKERS after calculating
       percentage coordinates. Multiple markers can use the same type.
       ================================================================ */

    const AMENITY_TYPES = {
      "guest-services": {
        label: "Guest Services",
        icon: "../assets/icons/guest-services.svg"
      },
      "elevator": {
        label: "Elevator",
        icon: "../assets/icons/elevator.svg"
      },
      "stairs": {
        label: "Stairs",
        icon: "../assets/icons/stairs.svg"
      },
      "gift-shop": {
        label: "Gift Shop",
        icon: "../assets/icons/gift-shop.svg"
      },
      "food-and-beverage": {
        label: "Food & Beverage",
        icon: "../assets/icons/food-and-beverage.svg"
      },
      "water-station": {
        label: "Water Station",
        icon: "../assets/icons/water-station.svg"
      },
      "washroom": {
        label: "Washroom",
        icon: "../assets/icons/washroom.svg"
      },
      "accessible-washroom": {
        label: "Accessible Washroom",
        icon: "../assets/icons/accessible-washroom.svg"
      },
      "genderless-washroom": {
        label: "Genderless Washroom",
        icon: "../assets/icons/genderless-washroom.svg"
      },
      "nursing-quiet-room": {
        label: "Nursing / Quiet Room",
        icon: "../assets/icons/nursing-quiet-room.svg"
      },
      "stroller-wagon-parking": {
        label: "Stroller & Wagon Parking",
        icon: "../assets/icons/stroller-wagon-parking.svg"
      },
      "lockers": {
        label: "Lockers",
        icon: "../assets/icons/lockers.svg"
      },
      "accessible-viewing": {
        label: "Accessible Viewing",
        icon: "../assets/icons/accessible-viewing.svg"
      }
    };

    const AMENITY_LEGEND_ORDER = [
      "guest-services",
      "elevator",
      "stairs",
      "gift-shop",
      "food-and-beverage",
      "water-station",
      "washroom",
      "accessible-washroom",
      "genderless-washroom",
      "nursing-quiet-room",
      "stroller-wagon-parking",
      "lockers",
      "accessible-viewing"
    ];

    const AMENITY_MARKERS = [
      /*
        Example only — uncomment after replacing with a real coordinate:

        {
          id: "guest-services-main-entrance",
          type: "guest-services",
          x: 50.0,
          y: 50.0,
          size: 29
        }
      */
    ];

    /* ================================================================
       4. GALLERY LEGEND PLACEHOLDER

       The gallery legend should ultimately reuse the same gallery names,
       SVG assets and colour values as the Daily Program Schedule module.
       ================================================================ */

    const GALLERY_LEGEND_ITEMS = [
      /*
        Example structure:
        {
          key: "tropics",
          label: "The Tropics",
          icon: "../assets/path-to-gallery-icon.svg",
          color: "#f3735f"
        }
      */
    ];

    /* ================================================================
       5. GENERIC RENDER HELPERS
       ================================================================ */

    function getAnchorClass(anchor = "center") {
      return anchor === "top-left" ? "anchor-top-left" : "anchor-center";
    }

    function setPosition(element, { x, y, anchor = "center" }) {
      element.classList.add("positioned", getAnchorClass(anchor));
      element.style.setProperty("--x", x);
      element.style.setProperty("--y", y);
      return element;
    }

    function makeImage(src, className, alt = "") {
      const image = document.createElement("img");
      image.src = src;
      image.alt = alt;
      image.className = className;
      return image;
    }

    function appendDebugDot(layer, x, y) {
      if (!DEBUG_MODE) return;
      const dot = document.createElement("span");
      dot.className = "debug-dot";
      dot.style.left = `${x}%`;
      dot.style.top = `${y}%`;
      layer.appendChild(dot);
    }

    /* ================================================================
       6. STATIC CHROME
       ================================================================ */

    function renderChrome() {
      const layer = document.getElementById("chromeLayer");
      const debugLayer = document.getElementById("debugLayer");
      const positions = MAP_PROFILE.chrome;

      const title = document.createElement("h1");
      title.id = "pageTitle";
      title.className = "page-title";
      title.textContent = MAP_PROFILE.titles[0] || "Visitor Map";
      setPosition(title, positions.title);
      layer.appendChild(title);

      const logo = makeImage("../assets/vaq-full-logo.svg", "vaq-logo");
      setPosition(logo, positions.logo);
      layer.appendChild(logo);

      const exitLabel = makeImage("../assets/icons/exit-label.svg", "wayfinding-asset direction-label");
      setPosition(exitLabel, positions.exitLabel);
      layer.appendChild(exitLabel);

      const exitArrow = makeImage("../assets/icons/exit-arrow.svg", "wayfinding-asset direction-arrow");
      setPosition(exitArrow, positions.exitArrow);
      layer.appendChild(exitArrow);

      const enterLabel = makeImage("../assets/icons/enter-label.svg", "wayfinding-asset direction-label");
      setPosition(enterLabel, positions.enterLabel);
      layer.appendChild(enterLabel);

      const enterArrow = makeImage("../assets/icons/enter-arrow.svg", "wayfinding-asset direction-arrow");
      setPosition(enterArrow, positions.enterArrow);
      layer.appendChild(enterArrow);

      const qrBlock = document.createElement("section");
      qrBlock.className = "qr-block";
      qrBlock.innerHTML = `
        <p class="qr-heading">Scan for PDF</p>
        <img class="qr-code" src="../assets/qr-code.svg" alt="">
        <p class="qr-url">vanaqua.org/visit/map/</p>
      `;
      setPosition(qrBlock, positions.qrBlock);
      layer.appendChild(qrBlock);

      const footer = document.createElement("div");
      footer.className = "footer-cta";
      footer.innerHTML = `
        <span>Share what you loved about your visit:</span>
        <strong>@VanAqua&nbsp;&nbsp;#VanAqua</strong>
      `;
      setPosition(footer, positions.footer);
      layer.appendChild(footer);

      Object.values(positions).forEach(({ x, y }) => appendDebugDot(debugLayer, x, y));
    }

    function startTitleRotation() {
      if (MAP_PROFILE.titles.length < 2) return;

      const title = document.getElementById("pageTitle");
      let titleIndex = 0;

      window.setInterval(() => {
        titleIndex = (titleIndex + 1) % MAP_PROFILE.titles.length;
        title.textContent = MAP_PROFILE.titles[titleIndex];
      }, TITLE_ROTATION_MS);
    }

    /* ================================================================
       7. MAP MARKERS
       ================================================================ */

    function renderAmenityMarkers() {
      const layer = document.getElementById("amenityMarkerLayer");
      const debugLayer = document.getElementById("debugLayer");

      AMENITY_MARKERS.forEach((marker) => {
        const type = AMENITY_TYPES[marker.type];

        if (!type) {
          console.warn(`Unknown amenity type: ${marker.type}`);
          return;
        }

        const image = makeImage(type.icon, "amenity-marker");
        image.dataset.markerId = marker.id;
        image.title = `${type.label} — ${marker.id}`;

        if (marker.size) {
          image.style.width = `${marker.size}px`;
        }

        setPosition(image, marker);
        layer.appendChild(image);
        appendDebugDot(debugLayer, marker.x, marker.y);
      });
    }

    function renderYouAreHere() {
      if (!MAP_PROFILE.youAreHere.visible) return;

      const layer = document.getElementById("dynamicMarkerLayer");
      const debugLayer = document.getElementById("debugLayer");
      const marker = makeImage(
        "../assets/you-are-here.svg",
        "program-marker you-are-here-marker"
      );

      setPosition(marker, MAP_PROFILE.youAreHere);
      layer.appendChild(marker);
      appendDebugDot(debugLayer, MAP_PROFILE.youAreHere.x, MAP_PROFILE.youAreHere.y);
    }

    function setNextProgramMarker(locationKey) {
      const layer = document.getElementById("dynamicMarkerLayer");
      const oldMarker = document.getElementById("nextProgramMarker");

      if (oldMarker) oldMarker.remove();
      if (!locationKey) return;

      const position = MAP_PROFILE.programLocationAnchors[locationKey];

      if (!position) {
        console.info(`No map anchor is configured for program location: ${locationKey}`);
        return;
      }

      const marker = makeImage(
        "../assets/next-program-here.svg",
        "program-marker next-program-marker"
      );

      marker.id = "nextProgramMarker";
      setPosition(marker, position);
      layer.appendChild(marker);
    }

    /* ================================================================
       8. LEGENDS
       ================================================================ */

    function renderLegends() {
      const layer = document.getElementById("legendLayer");
      const positions = MAP_PROFILE.chrome;

      const heading = document.createElement("h2");
      heading.className = "legend-heading";
      heading.textContent = "Legend";
      setPosition(heading, positions.legendHeading);
      layer.appendChild(heading);

      const galleryPlaceholder = document.createElement("section");
      galleryPlaceholder.className = "gallery-legend-placeholder";
      galleryPlaceholder.textContent = GALLERY_LEGEND_ITEMS.length
        ? "Gallery legend items are ready to render."
        : "Gallery legend placeholder — reuse the Daily Program Schedule gallery icon, colour and label data here.";
      setPosition(galleryPlaceholder, positions.galleryLegend);
      layer.appendChild(galleryPlaceholder);

      const amenityLegend = document.createElement("section");
      amenityLegend.className = "amenity-legend";

      AMENITY_LEGEND_ORDER.forEach((typeKey) => {
        const type = AMENITY_TYPES[typeKey];
        const row = document.createElement("div");
        row.className = "amenity-legend-item";
        row.innerHTML = `
          <img src="${type.icon}" alt="">
          <span>${type.label}</span>
        `;
        amenityLegend.appendChild(row);
      });

      setPosition(amenityLegend, positions.amenityLegend);
      layer.appendChild(amenityLegend);
    }

    /* ================================================================
       9. SUPABASE PREPARATION FOR FUTURE PROGRAM LOGIC
       ================================================================ */

    async function fetchProgramScheduleRows() {
      if (!PROGRAM_SCHEDULE_SOURCE) {
        updateDebugStatus("Supabase client initialized. Schedule polling is paused until PROGRAM_SCHEDULE_SOURCE is configured.");
        return [];
      }

      const { data, error } = await db
        .from(PROGRAM_SCHEDULE_SOURCE)
        .select("*");

      if (error) {
        console.error("Program schedule query failed:", error);
        updateDebugStatus(`Supabase query error: ${error.message}`);
        return [];
      }

      updateDebugStatus(`Supabase connected. Retrieved ${data.length} schedule row(s).`);
      return data;
    }

    async function refreshProgramSchedule() {
      const rows = await fetchProgramScheduleRows();

      /*
        TODO — Future milestone:
        1. Filter to relevant live schedule rows.
        2. Compare scheduled start times with the current time.
        3. Determine the next program.
        4. Match its location key to MAP_PROFILE.programLocationAnchors.
        5. Call setNextProgramMarker(locationKey).
      */

      return rows;
    }

    function startProgramPolling() {
      refreshProgramSchedule();

      if (!PROGRAM_SCHEDULE_SOURCE) return;

      window.setInterval(
        refreshProgramSchedule,
        PROGRAM_POLL_INTERVAL_MS
      );
    }

    /* ================================================================
       10. SIGNAGE VIEWPORT SCALING
       ================================================================ */

    function fitCanvasToViewport() {
      const canvasWidth = 1080;
      const canvasHeight = 1440;
      const scale = Math.min(
        window.innerWidth / canvasWidth,
        window.innerHeight / canvasHeight
      );

      document.documentElement.style.setProperty("--stage-scale", scale);
    }

    function updateDebugStatus(message) {
      const status = document.getElementById("debugStatus");
      status.textContent = [
        `Profile: ${MAP_PROFILE.key}`,
        `Canvas: 1080 × 1440`,
        `Amenity instances loaded: ${AMENITY_MARKERS.length}`,
        message
      ].join("\n");
    }

    /* ================================================================
       11. STARTUP
       ================================================================ */

    function initializePage() {
      document.getElementById("mapPage").classList.toggle("debug-enabled", DEBUG_MODE);
      fitCanvasToViewport();
      renderChrome();
      renderAmenityMarkers();
      renderYouAreHere();
      renderLegends();
      startTitleRotation();
      startProgramPolling();
    }

    window.addEventListener("resize", fitCanvasToViewport);
    window.addEventListener("DOMContentLoaded", initializePage);
  </script>
</body>
</html>
