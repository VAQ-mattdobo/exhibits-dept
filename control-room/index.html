<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>Digital Signage Control Room | Vancouver Aquarium</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <div class="header-title">
        <p class="organization">Vancouver Aquarium</p>

        <h1>Digital Signage Control Room</h1>

        <p class="subtitle">
          Web content inventory and Kuusoft device assignments
        </p>
      </div>

      <div class="header-status">

        <div class="summary" id="summary">
          Loading inventory…
        </div>

        <div class="inventory-signoff" id="inventorySignoff">
          Loading sign-off…
        </div>

      </div>

    </div>
  </header>

  <main>

    <section class="toolbar">

      <label class="search">
        <span>Search</span>
        <input
          type="search"
          id="searchInput"
          placeholder="Content, module, device, location or URL"
        >
      </label>

      <label>
        <span>Category</span>
        <select id="categoryFilter">
          <option value="all">All categories</option>
        </select>
      </label>

      <label>
        <span>Status</span>
        <select id="statusFilter">
          <option value="all">All statuses</option>
          <option value="review">Needs Review</option>
          <option value="live">Live</option>
          <option value="testing">Testing</option>
          <option value="standby">Standby</option>
          <option value="retired">Retired</option>
        </select>
      </label>

    </section>

    <section
      id="content"
      class="content-groups"
      aria-live="polite"
    ></section>

  </main>

  <footer>
    <p>
      Vancouver Aquarium — Internal Digital Signage Reference
    </p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
