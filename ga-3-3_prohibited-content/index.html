<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1536, initial-scale=0.6667, minimum-scale=0.6667, maximum-scale=0.6667, user-scalable=no" />
<title>VAQ Prohibited Items</title>

<!--
  Target container: 1536 x 810 px
  Scale fix applied for Kuusoft environment rendering oversized.
  Shared asset path note:
  This page uses the repo-level ../assets/ folder for common fonts, imagery,
  and prohibited-items SVG icons.
-->

<style>
  @font-face {
    font-family: 'BlissPro';
    src:
      url('../assets/BlissPro-Bold.woff2') format('woff2'),
      url('../assets/BlissPro-Bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 1536px;
    height: 810px;
    overflow: hidden;
    background: transparent;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: 'BlissPro', Arial, sans-serif;
  }

  .frame {
    position: relative;
    width: 1536px;
    height: 810px;
    overflow: hidden;
    background: #000;
  }

  .bg-rotator {
    position: absolute;
    width: 5000px;
    height: 5000px;
    top: -3500px;
    left: -1732px;
    background-image: url('../assets/RotCircAnim_5000x5000.jpg');
    background-repeat: no-repeat;
    background-size: 5000px 5000px;
    transform-origin: center center;
    animation: slowRotate 200s linear infinite;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes slowRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  /* Foreground layout */
  .content-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .items-layout {
    position: absolute;
    inset: 0;
  }

  .item {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 34px;
    min-width: 405px;
    height: 158px;
  }

  .item.col-1 { left: 60px; }
  .item.col-2 { left: 550px; }
  .item.col-3 { left: 1040px; }

  .item.row-1 { top: 80px; }
  .item.row-2 { top: 326px; }
  .item.row-3 { top: 572px; }

  .icon-wrap {
    flex: 0 0 auto;
    width: 158px;
    height: 158px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-wrap img {
    display: block;
    width: 158px;
    height: 158px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.18));
  }

  .item-label {
    margin: 0;
    color: #ffffff;
    font-family: 'BlissPro', Arial, sans-serif;
    font-size: 42px;
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.08;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.28);
    white-space: nowrap;
  }

  .item-label.wrap {
    white-space: normal;
  }
</style>
</head>

<body>
  <div class="frame">
    <div class="bg-rotator"></div>

    <div class="content-layer">
      <div class="items-layout" aria-label="Guest entry requirements and prohibited items">

        <div class="item col-1 row-1">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/balloons.svg" alt="" />
          </div>
          <p class="item-label">No balloons</p>
        </div>

        <div class="item col-2 row-1">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/clear-lids.svg" alt="" />
          </div>
          <p class="item-label">No clear lids</p>
        </div>

        <div class="item col-3 row-1">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/pets.svg" alt="" />
          </div>
          <p class="item-label">No pets</p>
        </div>

        <div class="item col-1 row-2">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/scooters.svg" alt="" />
          </div>
          <p class="item-label">No scooters</p>
        </div>

        <div class="item col-2 row-2">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/inline-skates.svg" alt="" />
          </div>
          <p class="item-label wrap">No in-line<br />skates</p>
        </div>

        <div class="item col-3 row-2">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/straws.svg" alt="" />
          </div>
          <p class="item-label">No straws</p>
        </div>

        <div class="item col-1 row-3">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/smoking.svg" alt="" />
          </div>
          <p class="item-label">No smoking</p>
        </div>

        <div class="item col-2 row-3">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/vaping.svg" alt="" />
          </div>
          <p class="item-label">No vaping</p>
        </div>

        <div class="item col-3 row-3">
          <div class="icon-wrap" aria-hidden="true">
            <img src="../assets/prohibited/shirt-shoes.svg" alt="" />
          </div>
          <p class="item-label wrap">Shirt &amp; shoes<br />required</p>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
