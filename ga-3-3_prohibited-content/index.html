<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1536, initial-scale=0.6667, minimum-scale=0.6667, maximum-scale=0.6667, user-scalable=no" />
<title>VAQ Prohibited Items</title>

<!--
  Target container: 1536 x 810 px
  Scale fix applied for Kuusoft environment rendering oversized.
  Shared asset path note:
  This page uses the repo-level ../assets/ folder for common fonts, imagery,
  and prohibited-items SVG icons.
-->

<style>
  @font-face {
    font-family: 'BlissPro';
    src:
      url('../assets/BlissPro-Bold.woff2') format('woff2'),
      url('../assets/BlissPro-Bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --vaq-white: #ffffff;
    --vaq-sky: #64a5c3;
    --vaq-orange: #f58220;
    --vaq-soft-green: #b8d987;
    --slide-duration-ms: 13500ms;
    --slide-transition-ms: 1400ms;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 1536px;
    height: 810px;
    overflow: hidden;
    background: transparent;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    font-family: 'BlissPro', Arial, sans-serif;
  }

  .frame {
    position: relative;
    width: 1536px;
    height: 810px;
    overflow: hidden;
    background: #000;
  }

  .bg-rotator {
    position: absolute;
    width: 5000px;
    height: 5000px;
    top: -3500px;
    left: -1732px;
    background-image: url('../assets/RotCircAnim_5000x5000.jpg');
    background-repeat: no-repeat;
    background-size: 5000px 5000px;
    transform-origin: center center;
    animation: slowRotate 200s linear infinite;
    z-index: 1;
    pointer-events: none;
  }

  @keyframes slowRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  .content-layer {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: translateY(26px) scale(0.99);
    transition:
      opacity var(--slide-transition-ms) ease,
      transform var(--slide-transition-ms) ease;
    pointer-events: none;
  }

  .slide.is-active {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .intro-slide {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .intro-card {
    width: 1180px;
    max-width: 80%;
    text-align: center;
    color: var(--vaq-white);
  }

  .intro-card::before,
  .intro-card::after {
    content: "";
    display: block;
    width: 270px;
    height: 8px;
    margin: 0 auto 42px;
    border-radius: 999px;
    background: var(--vaq-orange);
    box-shadow: 0 2px 18px rgba(0, 0, 0, 0.22);
  }

  .intro-card::after {
    margin: 42px auto 0;
    background: var(--vaq-sky);
  }

  .intro-text {
    margin: 0;
    font-family: 'BlissPro', Arial, sans-serif;
    font-size: 62px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: 0.004em;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.42);
  }

  .intro-thanks {
    margin-top: 44px;
    color: #e5f3cc;
    font-size: 56px;
    line-height: 1.08;
  }

  .items-slide {
    position: absolute;
    inset: 0;
  }

  .items-field {
    position: absolute;
    inset: 0;
  }

  .item {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 36px;
    min-width: 0;
    height: 160px;
  }

  .icon-wrap {
    flex: 0 0 auto;
    width: 158px;
    height: 158px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-wrap img {
    display: block;
    width: 158px;
    height: 158px;
    object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.18));
  }

  .item-label {
    margin: 0;
    color: var(--vaq-white);
    font-family: 'BlissPro', Arial, sans-serif;
    font-size: 40px;
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.06;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.28);
    white-space: nowrap;
  }

  .item-label.wrap {
    white-space: normal;
  }

  .item.required .item-label {
    color: #e5f3cc;
  }

  .item.required .icon-wrap img {
    filter:
      drop-shadow(0 0 9px rgba(0, 0, 0, 0.22))
      drop-shadow(0 0 10px rgba(184, 217, 135, 0.28));
  }
</style>
</head>

<body>
  <div class="frame">
    <div class="bg-rotator"></div>

    <main class="content-layer" aria-label="Guest entry requirements and prohibited items">
      <section class="slide intro-slide is-active" data-slide="intro" aria-label="Why some items are not permitted">
        <div class="intro-card">
          <p class="intro-text">For the safety of our animals, and comfort of our guests, some items are not permitted inside the Aquarium.</p>
          <p class="intro-text intro-thanks">Thank you for your cooperation.</p>
        </div>
      </section>

      <section class="slide items-slide" data-slide="group-1" aria-label="Required items and prohibited items, group one">
        <div class="items-field" data-items-grid="group-1"></div>
      </section>

      <section class="slide items-slide" data-slide="group-2" aria-label="Prohibited wheeled items, group two">
        <div class="items-field" data-items-grid="group-2"></div>
      </section>
    </main>
  </div>

<script>
  const SLIDE_DURATION_MS = 13500;
  const SLIDE_TRANSITION_MS = 1400;
  const ICON_BASE_PATH = '../assets/prohibited/';

  document.documentElement.style.setProperty('--slide-duration-ms', `${SLIDE_DURATION_MS}ms`);
  document.documentElement.style.setProperty('--slide-transition-ms', `${SLIDE_TRANSITION_MS}ms`);

  const itemGroups = {
    'group-1': [
      { label: 'Shirt & shoes\nrequired', file: 'shirt-shoes.svg', required: true, x: 60, y: 80 },
      { label: 'No smoking', file: 'smoking.svg', x: 76, y: 316 },
      { label: 'No vaping', file: 'vaping.svg', x: 568, y: 322 },
      { label: 'No balloons', file: 'balloons.svg', x: 1064, y: 328 },
      { label: 'No drinking\nstraws', file: 'straws.svg', x: 84, y: 556 },
      { label: 'No clear lids', file: 'clear-lids.svg', x: 548, y: 560 },
      { label: 'No pets', file: 'pets.svg', x: 1064, y: 574 }
    ],
    'group-2': [
      { label: 'No scooters', file: 'scooters.svg', x: 60, y: 92 },
      { label: 'No ride-on\nscooters', file: 'ride-on-scooters.svg', x: 548, y: 104 },
      { label: 'No in-line\nskates', file: 'inline-skates.svg', x: 1048, y: 112 },
      { label: 'No push cars', file: 'push-cars.svg', x: 60, y: 380 },
      { label: 'No wagons', file: 'wagons.svg', x: 548, y: 372 },
      { label: 'No jogging\nstrollers', file: 'jogging-strollers.svg', x: 1048, y: 376 }
    ]
  };

  function renderItems() {
    Object.entries(itemGroups).forEach(([groupName, items]) => {
      const field = document.querySelector(`[data-items-grid="${groupName}"]`);
      if (!field) return;

      field.innerHTML = items.map((item) => {
        const labelHtml = item.label.split('\n').join('<br />');
        const needsWrap = item.label.includes('\n');
        const requiredClass = item.required ? ' required' : '';
        const wrapClass = needsWrap ? ' wrap' : '';

        return `
          <div class="item${requiredClass}" style="left: ${item.x}px; top: ${item.y}px;">
            <div class="icon-wrap" aria-hidden="true">
              <img src="${ICON_BASE_PATH}${item.file}" alt="" />
            </div>
            <p class="item-label${wrapClass}">${labelHtml}</p>
          </div>
        `;
      }).join('');
    });
  }

  function startSlideRotation() {
    const slides = Array.from(document.querySelectorAll('.slide'));
    let activeIndex = 0;

    window.setInterval(() => {
      slides[activeIndex].classList.remove('is-active');
      activeIndex = (activeIndex + 1) % slides.length;
      slides[activeIndex].classList.add('is-active');
    }, SLIDE_DURATION_MS);
  }

  renderItems();
  startSlideRotation();
</script>
</body>
</html>
