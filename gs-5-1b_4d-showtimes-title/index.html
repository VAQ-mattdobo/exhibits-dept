<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=1920, initial-scale=0.6667, minimum-scale=0.6667, maximum-scale=0.6667, user-scalable=no"
  >
  <title>VAQ Titlebar – 4-D Showtimes with Clock</title>

<!--
  Target container: 1920 x 270 px
  Scale fix applied for Kuusoft environment rendering oversized.
  Shared asset path note:
  This page uses the repo-level ../assets/ folder for common fonts and imagery.
  Update these paths if the hosted folder structure changes later.

  Clock implementation note:
  No Program Schedule DB logic. Just a clock!
-->

  <style>
    @font-face {
      font-family: 'BlissPro';
      src:
        url('../assets/BlissPro-Bold.woff2') format('woff2'),
        url('../assets/BlissPro-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      width: 1920px;
      height: 270px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .wrapper {
      position: relative; /* trying to close a visual gap on the left */
      left: -8px; /* trying to close a visual gap on the left */
      width: 1928px; /* 1920 + 8 */
      height: 270px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      background-color: #ffffff;
      background-image: url('../assets/Titlebar-Nightmode_RptX_10x270.jpg');
      background-repeat: repeat-x;
      background-position: left top;
      background-size: auto 270px;

      overflow: hidden;
    }

    .title,
    #clock {
      font-family: 'BlissPro', Arial, sans-serif;
      font-size: 82px;
      line-height: 1;
      font-weight: 700;
      color: #f3bc43;
      letter-spacing: 0.5px;
      white-space: nowrap;

      transform: translateY(-11px);
    }

    .title {
      margin-left: 85px;
    }

    .clock-slot {
      margin-left: auto;
      margin-right: 130px;
      min-width: 410px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <div class="title">4-D Showtimes</div>
    <div class="clock-slot" aria-label="Current time">
      <div id="clock">--:-- a.m.</div>
    </div>
  </div>

  <script>
    const TIMEZONE_NAME = 'America/Vancouver';
    const clockEl = document.getElementById('clock');

    function getTimePartsInTimezone(date = new Date(), timeZone = TIMEZONE_NAME) {
      const formatter = new Intl.DateTimeFormat('en-CA', {
        timeZone,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      const parts = formatter.formatToParts(date);
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));

      return {
        hour: Number(map.hour),
        minute: Number(map.minute)
      };
    }

    function formatClockText() {
      const now = getTimePartsInTimezone();
      let hours = now.hour;
      const minutes = now.minute;

      const isPM = hours >= 12;
      const meridiem = isPM ? 'p.m.' : 'a.m.';

      hours = hours % 12 || 12;
      const minuteText = minutes < 10 ? '0' + minutes : String(minutes);

      return `${hours}:${minuteText} ${meridiem}`;
    }

    function updateClockFace() {
      clockEl.textContent = formatClockText();
    }

    updateClockFace();
    setInterval(updateClockFace, 1000);
  </script>

</body>
</html>
